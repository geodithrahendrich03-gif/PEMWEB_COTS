<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Soal 1 - Header dan Toolbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="app-header">
        <span class="brand">COTS 1 ProWeb</span>
        <span class="user">Hi, 103092400015 - Geodithra Hendrich</span>
      </div>
      <div class="app-toolbar">
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-tool">
            <img src="icons/kotak-masuk-abu.svg" alt="">Incoming Letter
          </button>
          <button type="button" class="btn btn-tool">
            <img src="icons/folder-abu.svg" alt="">My Folder
          </button>
        </div>
        <form class="search-box" action="#" method="get">
          <input type="text" name="search" placeholder="Search ..." aria-label="Search">
          <button type="submit" aria-label="Cari">
            <img src="icons/cari-abu.svg" alt="">
          </button>
        </form>
      </div>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
