<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Soal 4 - Panel Todo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <div class="demo-wrap">
      <section class="mt-4 px-3">
        <div class="todo-panel">
          <div class="todo-title">Todo</div>
          <div class="todo-search">
            <input type="text" name="todo" placeholder="Search todo..." aria-label="Search todo">
            <button type="button" aria-label="Cari todo">
              <img src="icons/cari-abu-gelap.svg" alt="">
            </button>
          </div>
        </div>
        <p class="todo-empty">You don’t have ToDo</p>
      </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
